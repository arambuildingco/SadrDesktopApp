name: Release

# Builds the Windows app and publishes it as a GitHub Release whenever a version
# tag (v1.7, v1.8, …) is pushed. A manual run builds the same packages but only
# stores them as workflow artifacts, so the pipeline can be tested without a tag.
#
# Release assets:
#   SadrApp-Setup-<tag>.zip  full offline installer (SadrSetup.exe + app + redists)
#   SadrApp-win-x64.zip      app binaries only (needs .NET 10 Desktop Runtime)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # v1.7 for tag pushes, "dev" for a manual test run
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish the app (win-x64, framework-dependent)
        shell: pwsh
        run: |
          dotnet publish SadrApp/SadrApp.csproj -c Release -r win-x64 --self-contained false -o dist/app -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'SadrApp publish failed' }
          Compress-Archive -Path dist/app/* -DestinationPath dist/SadrApp-win-x64.zip -Force

      # The full offline package the testers use: re-publishes the app, builds the
      # net472 setup wizard and downloads the .NET runtime + LocalDB redists.
      # Non-blocking on purpose: a download hiccup must never block the app package.
      - name: Build the offline installer package
        id: installer
        shell: pwsh
        continue-on-error: true
        run: |
          & ./build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build-installer.ps1 failed' }
          Compress-Archive -Path dist/SadrApp-Setup -DestinationPath "dist/SadrApp-Setup-$env:VERSION.zip" -Force

      - name: Show the packages
        shell: pwsh
        run: Get-ChildItem dist/*.zip | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @(
            'Build ' + $env:VERSION + ' of SadrApp (Windows x64).'
            ''
            '**SadrApp-Setup-' + $env:VERSION + '.zip** — full offline package: unzip and run `SadrSetup.exe` as administrator. The wizard installs the .NET 10 runtime and SQL Server 2022 LocalDB when they are missing, creates the database and adds a Start-Menu shortcut. Windows 10/11 x64. No default credentials — first launch asks for the main admin username/password.'
            ''
            '**SadrApp-win-x64.zip** — application binaries only, for a machine that already has the .NET 10 Desktop Runtime and a SQL Server/LocalDB instance (put `Connection.dat` beside `SadrApp.exe`).'
          ) -join "`n"

          gh release view $env:VERSION 2>$null | Out-Null
          $zips = Get-ChildItem dist/*.zip | ForEach-Object FullName
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:VERSION $zips --clobber
          } else {
            gh release create $env:VERSION $zips --title $env:VERSION --notes $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'release step failed' }

      - name: Upload the packages (manual test runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: SadrApp-packages
          path: dist/*.zip
          if-no-files-found: error
