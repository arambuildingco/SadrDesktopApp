name: Release

# Temporary diagnostic matrix: finds a Windows runner where `dotnet restore`
# actually works. The build/publish steps return as soon as a working image is
# identified (see the follow-up commit).
#
# Every row reports its result in step names, which are readable on the public
# run page without opening the (sign-in protected) log.

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: latest
            use_setup: 'true'
          - os: windows-2022
            label: '2022'
            use_setup: 'true'
          - os: windows-2025
            label: '2025'
            use_setup: 'true'
          - os: windows-latest
            label: latest-preinstalled
            use_setup: 'false'
    runs-on: ${{ matrix.os }}
    env:
      RestoreSources: https://api.nuget.org/v3/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        if: matrix.use_setup == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Probe SDK and machine NuGet config
        id: sdk
        shell: pwsh
        run: |
          function Clip([string]$s, [int]$max) {
            $s = $s -replace '[^A-Za-z0-9 .,:/()_+=@-]', '?'
            if ($s.Length -gt $max) { $s = $s.Substring(0, $max) }
            if (-not $s) { $s = 'none' }
            return $s
          }
          $sdks = @(dotnet --list-sdks 2>&1 | ForEach-Object { "$_" })
          $v = if ($sdks.Count -gt 0) { ($sdks[-1] -split '\s+')[0] } else { 'NONE' }
          "v=$v" >> $env:GITHUB_OUTPUT

          $cfg = @(
            (Join-Path $env:APPDATA 'NuGet\NuGet.Config'),
            'C:\Program Files\dotnet\sdk\NuGet.Config'
          ) | Where-Object { Test-Path $_ }
          $body = ($cfg | ForEach-Object { Get-Content $_ -Raw }) -join ' '
          $body = ($body -split "`r?`n" | Where-Object { $_ -match '<' -and $_ -notmatch '^\s*<!--' }) -join ' '
          "cfg=$(Clip $body 150)" >> $env:GITHUB_OUTPUT

          $mb = (Get-ChildItem env: | Where-Object { $_.Name -match '(?i)^MSBUILD|^NUGET|^DOTNET_' } |
            ForEach-Object { $_.Name }) -join ','
          "envnames=$(Clip $mb 150)" >> $env:GITHUB_OUTPUT

      - name: "${{ matrix.label }}: SDK ${{ steps.sdk.outputs.v }} | env ${{ steps.sdk.outputs.envnames }}"
        shell: pwsh
        run: Write-Host 'sdk probe'

      - name: "${{ matrix.label }}: NuGet config ${{ steps.sdk.outputs.cfg }}"
        shell: pwsh
        run: Write-Host 'config probe'

      - name: Control restore of a fresh project
        id: fresh
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'probe-restore'
          & dotnet new classlib -o $d --force 2>&1 | Out-Null
          $out = & dotnet restore $d 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Host
          $last = @($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 1
          $last = "$last" -replace '[^A-Za-z0-9 .,:/()_+#=-]', '?'
          if ($last.Length -gt 90) { $last = $last.Substring(0, 90) }
          "r=$code | $last" >> $env:GITHUB_OUTPUT
          exit 0

      - name: "${{ matrix.label }}: fresh project restore -> ${{ steps.fresh.outputs.r }}"
        shell: pwsh
        run: Write-Host 'control restore'

      - name: Restore SadrApp
        id: app
        shell: pwsh
        run: |
          $out = & dotnet restore SadrApp/SadrApp.csproj -r win-x64 --verbosity minimal --source https://api.nuget.org/v3/index.json 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Host
          $last = @($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 1
          $last = "$last" -replace '[^A-Za-z0-9 .,:/()_+#=-]', '?'
          if ($last.Length -gt 90) { $last = $last.Substring(0, 90) }
          "r=$code | $last" >> $env:GITHUB_OUTPUT
          exit 0

      - name: "${{ matrix.label }}: SadrApp restore -> ${{ steps.app.outputs.r }}"
        shell: pwsh
        run: Write-Host 'app restore'
