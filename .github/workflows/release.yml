name: Release

# Builds the Windows app and publishes it to GitHub Releases.
#
#   push a v* tag   -> versioned release (v1.7, …), kept forever
#   push to main    -> the rolling "latest" release is replaced, so its assets
#                      always match the newest commit on main
#   manual run      -> publishes "latest" too, and stores the zips as artifacts
#
# Release assets:
#   SadrApp-Setup-<ver>.zip  full offline installer (SadrSetup.exe + app + redists)
#   SadrApp-win-x64.zip      app binaries only (needs .NET 10 Desktop Runtime)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Never two releases racing: a newer push to the same ref cancels the run in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      # v1.7 for tag pushes, "latest" for main builds and manual runs
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
      # The runner image also registers a machine-level "Microsoft Visual Studio
      # Offline Packages" feed; restore dies on it in ~40 ms with no logged error,
      # so every restore in this job (including build-installer.ps1's publishes)
      # is pinned to nuget.org, where all of this project's packages live.
      RestoreSources: https://api.nuget.org/v3/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The SDK version is echoed into the step name so it is visible on the public
      # run page without opening the (sign-in protected) log.
      - name: Probe the runner SDK
        id: sdk
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          $v = if ($sdks.Count -gt 0) { ($sdks[-1] -split '\s+')[0] } else { 'NONE' }
          "v=$v" >> $env:GITHUB_OUTPUT
          Write-Host "installed SDKs: $sdks"

      - name: SDK on runner = ${{ steps.sdk.outputs.v }}
        shell: pwsh
        run: dotnet --version

      # Split out of the publish step: whichever of these turns red tells us whether
      # the failure is NuGet restore, compile/publish, or just zipping the output.
      # Restore fails silently (MSB4181 "returned false but did not log an error"), so
      # the configured sources and the interesting output lines are copied into the
      # following step names: step names are readable on the public run page, while
      # log text needs a signed-in session. Values are stripped to a YAML-safe charset.
      - name: List NuGet sources
        id: srcs
        shell: pwsh
        run: |
          $out = & dotnet nuget list source 2>&1 | Out-String
          $out | Write-Host
          $names = @($out -split "`r?`n" | Where-Object { $_ -match '^\s*\d+\.\s+' } |
            ForEach-Object { ($_ -replace '^\s*\d+\.\s+', '').Trim() })
          $list = ($names -join ' | ') -replace '[^A-Za-z0-9 .,:/()_+=@-]', '?'
          if ($list.Length -gt 150) { $list = $list.Substring(0, 150) }
          "list=$list" >> $env:GITHUB_OUTPUT

      - name: "NuGet sources: ${{ steps.srcs.outputs.list }}"
        shell: pwsh
        run: Write-Host 'sources listed above'

      - name: Restore packages
        id: restore
        shell: pwsh
        run: |
          $out = & dotnet restore SadrApp/SadrApp.csproj -r win-x64 --verbosity minimal --source https://api.nuget.org/v3/index.json 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out | Write-Host
          $lines = @($out -split "`r?`n" | Where-Object { $_.Trim() -ne '' })
          function Clip($s) {
            if ($null -eq $s) { return 'none' }
            $s = "$s".Trim() -replace '[^A-Za-z0-9 .,:/()_+#=-]', '?'
            if ($s.Length -gt 110) { $s = $s.Substring(0, 110) }
            if (-not $s) { $s = 'none' }
            return $s
          }
          $net  = $lines | Where-Object { $_ -match '(?i)(status code|429|431|401|403|forbidden|denied|unable|timeout|timed out|socket|connection|quota)' } | Select-Object -First 1
          $codeLine = $lines | Where-Object { $_ -match '(?i)\b(error|exception)\b' -and $_ -notmatch 'MSB4181' } | Select-Object -First 1
          $o = $lines | Select-Object -First 1
          $t = $lines | Select-Object -Last 1
          $t2 = $lines | Select-Object -Last 2 | Select-Object -First 1
          "first=$(Clip $o)" >> $env:GITHUB_OUTPUT
          "net=$(Clip $net)" >> $env:GITHUB_OUTPUT
          "codeline=$(Clip $codeLine)" >> $env:GITHUB_OUTPUT
          "tail=$(Clip $t)" >> $env:GITHUB_OUTPUT
          "tail2=$(Clip $t2)" >> $env:GITHUB_OUTPUT
          if ($code -ne 0) { exit $code }

      - name: "Restore error line: ${{ steps.restore.outputs.codeline }}"
        if: always() && steps.restore.outcome == 'failure'
        shell: pwsh
        run: Write-Host 'see restore'

      - name: "Restore network line: ${{ steps.restore.outputs.net }}"
        if: always() && steps.restore.outcome == 'failure'
        shell: pwsh
        run: Write-Host 'see restore'

      - name: "Restore first line: ${{ steps.restore.outputs.first }}"
        if: always() && steps.restore.outcome == 'failure'
        shell: pwsh
        run: Write-Host 'see restore'

      - name: "Restore last 2 lines: ${{ steps.restore.outputs.tail2 }} // ${{ steps.restore.outputs.tail }}"
        if: always() && steps.restore.outcome == 'failure'
        shell: pwsh
        run: Write-Host 'see restore'

      - name: Publish the app (win-x64, framework-dependent)
        shell: pwsh
        run: |
          dotnet publish SadrApp/SadrApp.csproj -c Release -r win-x64 --self-contained false -o dist/app -p:PublishSingleFile=false --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'SadrApp publish failed' }

      - name: Zip the app
        shell: pwsh
        run: |
          Compress-Archive -Path dist/app/* -DestinationPath dist/SadrApp-win-x64.zip -Force
          Get-Item dist/SadrApp-win-x64.zip | Select-Object Name, Length | Format-List

      # The full offline package the testers use: re-publishes the app, builds the
      # net472 setup wizard and downloads the .NET runtime + LocalDB redists.
      # Non-blocking on purpose: a download hiccup must never block the app package.
      - name: Build the offline installer package
        id: installer
        shell: pwsh
        continue-on-error: true
        run: |
          & ./build-installer.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build-installer.ps1 failed' }
          Compress-Archive -Path dist/SadrApp-Setup -DestinationPath "dist/SadrApp-Setup-$env:VERSION.zip" -Force

      - name: Show the packages
        shell: pwsh
        run: Get-ChildItem dist/*.zip | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize

      - name: Publish the release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { 'latest' }
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $zips = Get-ChildItem dist/*.zip | ForEach-Object FullName

          if ($tag -eq 'latest') {
            $title = 'SadrApp — latest build'
            $head = 'Newest build of main (' + $sha + '), published automatically on every push.'
          } else {
            $title = $tag
            $head = 'Build ' + $tag + ' of SadrApp (Windows x64), commit ' + $sha + '.'
          }
          $notes = @(
            $head
            ''
            '**SadrApp-Setup-' + $env:VERSION + '.zip** — full offline package: unzip and run `SadrSetup.exe` as administrator. The wizard installs the .NET 10 runtime and SQL Server 2022 LocalDB when they are missing, creates the database and adds a Start-Menu shortcut. Windows 10/11 x64. No default credentials — first launch asks for the main admin username/password.'
            ''
            '**SadrApp-win-x64.zip** — application binaries only, for a machine that already has the .NET 10 Desktop Runtime and a SQL Server/LocalDB instance (`Connection.dat` beside `SadrApp.exe`).'
          ) -join "`n"

          if ($tag -eq 'latest') {
            # Rolling release: drop the previous one and its tag, so the assets
            # always belong to the commit that triggered this run.
            gh release delete latest --yes --cleanup-tag 2>$null | Out-Null
            gh release view latest 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "the previous 'latest' release could not be removed" }
            gh release create latest $zips --title $title --notes $notes --target $env:GITHUB_SHA
          } else {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zips --clobber
            } else {
              gh release create $tag $zips --title $title --notes $notes --verify-tag
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'release step failed' }
          Write-Host "published: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"

      - name: Upload the packages (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SadrApp-packages
          path: dist/*.zip
          if-no-files-found: error
